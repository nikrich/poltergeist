name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev,api]"
      - name: Run tests
        # Deliberately NOT tests/ in full — test_calendar, test_joplin, and
        # test_weekly_digest depend on macOS-native frameworks (EventKit, etc.)
        # and fail off this Mac. Only the API and connector tests are CI-safe.
        run: |
          python -m pytest \
            ghostbrain/api/tests/ \
            tests/test_atlassian_import_refactor.py \
            tests/test_confluence_connector.py \
            tests/test_jira_connector.py \
            tests/test_no_hardcoded_contexts.py \
            tests/test_conftest_isolation.py \
            tests/test_doctor_core.py \
            tests/test_doctor_app_checks.py \
            tests/test_doctor_recorder_checks.py \
            tests/test_doctor_connector_checks.py \
            tests/test_setup_dispatch.py \
            tests/test_setup_deps.py \
            tests/test_setup_fetch_model.py \
            tests/test_setup_install_hook.py \
            tests/test_setup_small_fixes.py \
            tests/test_setup_audio_device.py \
            tests/test_session_end.py \
            tests/test_claude_settings.py \
            tests/test_recorder_start_preflight.py \
            tests/test_manual_transcribe_errors.py \
            tests/test_bootstrap_routing_mode.py \
            tests/test_connector_probe_calendar.py \
            tests/test_logging_setup.py \
            tests/test_llm_providers_base.py \
            tests/test_llm_providers_claude.py \
            tests/test_llm_providers_codex.py \
            tests/test_llm_providers_codex_chat.py \
            tests/test_llm_providers_config.py \
            tests/test_llm_providers_gemini.py \
            tests/test_llm_providers_gemini_chat.py \
            tests/test_llm_providers_openai_http.py \
            tests/test_llm_providers_openai_http_chat.py \
            tests/test_llm_providers_vault_tools.py \
            -q

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run
      - name: Type check
        run: npm run typecheck

  # Native macOS capture helper (ScreenCaptureKit). Only runs when the package
  # or this workflow changed — a macOS runner is expensive and the helper is
  # independent of the Python/desktop code paths.
  native-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"   # no usable base (force push, first push) — run it
            exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(native/|scripts/build-native-macos\.sh|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  native-macos:
    needs: native-changes
    if: needs.native-changes.outputs.changed == 'true'
    runs-on: macos-15  # macOS 15 SDK needed for SCStreamConfiguration.captureMicrophone
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/macos/ghostbrain-capture
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6.2 — the toolchain the capture helper is written against)
        # Xcode 16.4's Swift 6.1 rejects CaptureSession.swift under strict concurrency
        # ("sending 'stream' risks causing data races"); the helper was built and tested
        # with Swift 6.2. Fail loudly if the image has no Xcode 26 rather than silently
        # compiling with an older toolchain.
        run: |
          xc="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xc" ]; then echo "No Xcode 26 on this runner image; available:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$xc/Contents/Developer"
          xcodebuild -version
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Unit tests (Core)
        run: swift test
      - name: Smoke
        # Only --version / --help are asserted: `check` needs TCC grants a
        # hosted runner never has, so it is logged for information only.
        run: |
          set -euo pipefail
          bin=.build/release/ghostbrain-capture
          test "$($bin --version)" = "0.1.0"
          $bin --help | grep -q '^USAGE'
          $bin check --json || echo "check exited $? (expected on CI: no Screen Recording / Microphone grants)"
      - name: Build script (stages desktop/resources/bin)
        working-directory: .
        run: |
          scripts/build-native-macos.sh
          test -x desktop/resources/bin/ghostbrain-capture
