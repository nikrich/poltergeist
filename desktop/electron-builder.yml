appId: tech.codeship.ghostbrain
productName: Poltergeist
copyright: Copyright © 2026 Jannik

directories:
  output: dist
  buildResources: build

# Only ship what the runtime needs.
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/__tests__/**"
  - "!**/*.test.*"

# The PyInstaller sidecar bundle. CI writes it to resources/sidecar/ before
# running electron-builder. Path is relative to the desktop/ project root.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  # TCC attributes permission prompts to the *responsible* process, which for the
  # bundled ghostbrain-capture helper is this app — so the usage strings must
  # live here, not only in the helper's embedded Info.plist.
  extendInfo:
    NSCameraUsageDescription: Poltergeist uses your camera to capture photos directly into jots.
    NSScreenCaptureUsageDescription: Poltergeist records the audio of your meetings and captures presentation slides via ScreenCaptureKit.
    NSMicrophoneUsageDescription: Poltergeist records your microphone during meetings so your own voice is in the transcript.
    NSAudioCaptureUsageDescription: Poltergeist records system audio during meetings so the other participants are in the transcript.
  # The native ScreenCaptureKit capture helper (native/macos/ghostbrain-capture),
  # built by scripts/build-native-macos.sh into resources/bin/ before packaging.
  # macOS-only, hence under mac: rather than the top-level extraResources.
  extraResources:
    - from: resources/bin
      to: bin
  # Signed explicitly with the hardened runtime + inherited entitlements
  # (audio-input) so notarization accepts the nested Mach-O.
  binaries:
    - Contents/Resources/bin/ghostbrain-capture
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs via the afterSign hook (scripts/notarize.cjs) so we can
  # use notarytool with an app-specific password. electron-builder's built-in
  # notarize uses the legacy altool path.
  notarize: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64

afterSign: scripts/notarize.cjs

dmg:
  sign: false  # The .dmg itself isn't signed; the .app inside is.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64

# Auto-update via electron-updater. See docs/release.md.
publish:
  provider: github
  owner: nikrich
  repo: poltergeist
